<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fay · 数字讲解员</title>
<style>
:root{color-scheme:dark;font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;color:#e7ecf2;background:#0d1117;font-size:14px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid #364352;background:#202b38;color:#e6edf5;border-radius:9px;padding:10px 15px;transition:.15s}button:hover{border-color:#7eb4bc;background:#29394a}button:disabled{opacity:.4;cursor:wait}button.primary{background:#76d3be;border-color:#76d3be;color:#07231d;font-weight:700}button.danger{color:#ffb0a4;border-color:#694138;background:#30221f}header{height:74px;border-bottom:1px solid #27313d;padding:0 28px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;gap:12px;align-items:center}.mark{width:34px;height:34px;display:grid;place-items:center;border-radius:10px;background:#76d3be;color:#0b2822;font-size:20px;font-weight:700}.brand b{font-size:18px}.brand small{display:block;color:#8e9cac;font-size:11px;letter-spacing:2px;margin-top:3px}.tag{border:1px solid #34404c;color:#a6b5c5;padding:5px 9px;border-radius:20px;font-size:11px}.tag.ok{border-color:#356659;color:#91ddc5}.tag.warn{color:#ebca82;border-color:#645537}main{display:grid;grid-template-columns:minmax(280px,1fr) 330px;gap:22px;max-width:1580px;margin:22px auto;padding:0 24px}.stage-wrap{min-width:0;position:sticky;top:20px;align-self:start}.stage{background:#000;border:1px solid #29333f;border-radius:14px;height:calc(100vh - 172px);min-height:520px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.stage img,.stage video{width:100%;height:100%;object-fit:contain;position:absolute;inset:0;background:#000}.stage [hidden]{display:none}.stage:fullscreen{border:0;border-radius:0;width:100vw;height:100vh}.stage:fullscreen .stage-label{display:none}.exit-fullscreen{display:none;position:absolute;right:16px;top:16px;z-index:5;background:#121a1bcc;border-color:#33413e;font-size:12px}.stage:fullscreen .exit-fullscreen{display:block}.stage-label{position:absolute;left:20px;top:18px;z-index:2;color:#73838b;font-size:11px;letter-spacing:2px;pointer-events:none}.stage-message{position:absolute;bottom:18px;padding:8px 14px;border-radius:20px;background:#16211de6;border:1px solid #30453c;color:#b8dfcf;font-size:12px;z-index:2}.stage:fullscreen .stage-message{opacity:0}.stage-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#82909f;font-size:12px}.side{display:flex;flex-direction:column;gap:16px}.card{background:#151c25;border:1px solid #293440;border-radius:13px;padding:18px}.card h2{font-size:14px;margin:0 0 14px}.small{font-size:12px;color:#8e9cac;line-height:1.7}.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:8px;font-size:12px}.tabs .selected{background:#2c4a43;border-color:#6db7a5;color:#b9f2df}textarea,input{width:100%;border:1px solid #354250;background:#0d141d;border-radius:8px;color:#edf2f6;padding:11px;outline:none}textarea:focus,input:focus{border-color:#76b8a8}textarea{resize:vertical;min-height:92px;line-height:1.6}.row{display:flex;gap:8px;margin-top:10px}.row button{flex:1}.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action-grid button{text-align:left;padding:12px}.action-grid small{display:block;color:#8495a6;font-size:11px;margin-top:4px}.status-line{display:flex;justify-content:space-between;margin:10px 0;align-items:center}.status-line span:first-child{color:#aebbc9;font-size:12px}.answer{white-space:pre-wrap;line-height:1.7;color:#c5d2df;font-size:13px;max-height:160px;overflow:auto;margin-top:12px}.message{font-size:12px;line-height:1.7;color:#a7b9c8;margin-top:10px;min-height:20px}.message.error{color:#ffb0a4}details{border-top:1px solid #293440;margin-top:14px;padding-top:12px}summary{cursor:pointer;color:#9ec8bd;font-size:12px}label{display:block;font-size:12px;color:#93a5b8;margin:12px 0 6px}.top-status{display:flex;gap:7px}a{color:#a7d9cd}.note{margin-top:10px;font-size:11px;color:#798c9e;line-height:1.6}@media(max-width:780px){main{grid-template-columns:1fr}.stage-wrap{position:static}.stage{height:65vh;min-height:400px}.side{display:grid;grid-template-columns:1fr 1fr}.side>.card:first-child{grid-column:1/-1}}@media(max-width:600px){header{padding:0 15px}.top-status{display:none}main{padding:0 12px}.side{display:flex}.stage{height:62vh;min-height:360px}}
</style>
<header><div class="brand"><div class="mark">F</div><div><b>数字讲解员</b><small>FAY · VIRTUAL PRESENTER</small></div></div><div class="top-status"><span class="tag" id="fay-tag">Fay 连接中</span><span class="tag" id="model-tag">口型准备中</span></div></header>
<main><section class="stage-wrap"><div class="stage" id="stage"><img id="rest" src="/rest.png" alt="数字讲解员待机"><video id="player" playsinline preload="auto" hidden></video><span class="stage-label">数字人展示</span><button class="exit-fullscreen" id="exit-fullscreen">退出全屏</button><div class="stage-message" id="stage-message">就绪后，点击右侧按钮开始</div></div><div class="stage-footer"><span>黑底全身 · 真人视频形象</span><button id="fullscreen">全屏展示 ↗</button></div></section>
<aside class="side"><section class="card"><h2>对话与播报</h2><div class="tabs"><button class="selected" data-mode="say">直接播报</button><button data-mode="chat">通义问答</button></div><textarea id="text" maxlength="240" placeholder="输入要让讲解员说的话，例如：您好，欢迎来到我们的展厅。"></textarea><div class="row"><button class="primary" id="send">开始播报</button><button class="danger" id="interrupt">打断 / 停止</button></div><div id="message" class="message" role="status">先启动 Fay，再输入文字。直接播报使用本机中文语音。</div><div class="answer" id="answer"></div><div class="note">当前为文字输入联调。语音输入接入后可扩展为麦克风对话。</div></section>
<section class="card"><h2>动作预览</h2><div class="action-grid"><button data-motion="welcome-wave">迎宾挥手<small>欢迎与接待</small></button><button data-motion="goodbye-wave">告别挥手<small>结束与送别</small></button><button data-motion="explain-open-palms">摊手讲解<small>介绍与说明</small></button><button data-motion="acknowledge-nod">点头确认<small>轻点头剪辑候选</small></button></div><div class="note">点击可单独预览动作；正式播报由 Fay 的动作语义选择对应素材。</div></section>
<section class="card"><h2>服务连接</h2><a class="small" href="http://127.0.0.1:5000/setting" target="_blank" rel="noreferrer">打开 Fay 人设与服务设置 ↗</a><div class="status-line"><span>Fay 对话核心</span><span id="core-state" class="tag">检查中</span></div><div class="status-line"><span>本机口型模型</span><span id="render-state" class="tag">准备中</span></div><div class="status-line"><span>百炼 · 通义千问</span><span id="provider-state" class="tag warn">待配置</span></div><button id="start" style="width:100%;margin-top:8px">启动 Fay 核心</button><details><summary>配置百炼模型</summary><label for="model">模型名称</label><input id="model" value="qwen-plus" autocomplete="off"><label for="base-url">百炼兼容接口地址</label><input id="base-url" value="https://dashscope.aliyuncs.com/compatible-mode/v1" autocomplete="off"><label for="api-key">API Key（仅在本机保存，不回显）</label><input id="api-key" type="password" autocomplete="new-password" placeholder="在这里输入百炼密钥"><button id="save-provider" style="width:100%;margin-top:12px">保存百炼配置</button><p class="small">保存后不会自动发起模型请求。通义问答将通过 Fay 调用所配置的模型。</p><a class="small" target="_blank" rel="noreferrer" href="https://help.aliyun.com/zh/model-studio/get-api-key">查看百炼密钥说明 ↗</a></details></section></aside></main>
<script>
const $=s=>document.querySelector(s),player=$('#player'),rest=$('#rest');
let epoch=0,mode='say',socket,playing=null,queue=[],requestSerial=0,clientId=null;
const names={'idle':'说话','welcome-wave':'迎宾挥手','goodbye-wave':'告别挥手','explain-open-palms':'摊手讲解','acknowledge-nod':'点头确认'};
function message(text,error=false){$('#message').textContent=text;$('#message').className='message'+(error?' error':'');}
function badge(id,text,ok){$(id).textContent=text;$(id).className='tag '+(ok?'ok':'warn');}
async function api(path,body={}){const response=await fetch('/api/'+path,{method:'POST',headers:{'Content-Type':'application/json','X-Avatar-Client':'1','X-Avatar-Viewer':clientId||''},body:JSON.stringify(body)});if(!response.ok){throw Error(await response.text());}return response.json();}
function stopLocal(){requestSerial++;queue=[];player.pause();player.removeAttribute('src');player.load();player.hidden=true;rest.hidden=false;playing=null;$('#stage-message').textContent='已停止，回到待机';}
function receipt(event,job){if(socket?.readyState===1&&job?.job_id)socket.send(JSON.stringify({event,job_id:job.job_id}));}
async function next(){if(playing||!queue.length)return;const item=queue.shift();if(item.epoch!==epoch){next();return;}playing=item;const serial=++requestSerial;player.src=item.video;player.muted=!!item.silent;player.load();try{await player.play();if(serial!==requestSerial)return;player.hidden=false;rest.hidden=true;$('#stage-message').textContent=names[item.action]||'正在播报';receipt('playback_started',item);}catch(e){if(serial!==requestSerial)return;message('浏览器尚未允许播放，请点击人物画面继续。',true);}}
player.onended=async()=>{const item=playing;if(!item)return;playing=null;receipt('playback_ended',item);const src=item.rest||'/rest.png';const img=new Image();img.src=src;try{await img.decode();}catch{}if(playing!==null)return;rest.src=src;rest.hidden=false;player.hidden=true;playing=null;$('#stage-message').textContent='待机';next();};
player.onerror=()=>{if(playing){receipt('playback_error',playing);message('视频播放失败，请检查本机输出。',true);playing=null;player.hidden=true;rest.hidden=false;next();}};
$('#stage').onclick=()=>{if(playing&&player.paused)player.play().then(()=>{player.hidden=false;rest.hidden=true;receipt('playback_started',playing);}).catch(()=>{});};
function connect(){socket=new WebSocket('ws://'+location.host+'/ws');socket.onmessage=({data})=>{const e=JSON.parse(data);if(e.event==='state'){clientId=e.client_id;epoch=e.epoch;return;}if(e.event==='playback_owner_changed'&&e.playback_owner!==clientId){stopLocal();message('展示已由另一个窗口接管。点击播报或动作可切回本窗口。');return;}if(e.epoch<epoch)return;if(e.event==='interrupted'){epoch=e.epoch;stopLocal();message(e.reason==='new_turn'?'正在等待 Fay 处理…':'已打断当前播报与待播队列。');return;}if(e.epoch!==epoch){epoch=e.epoch;stopLocal();}if(e.event==='queued')message('Fay 已生成语音，等待口型处理…');if(e.event==='rendering'){message('正在生成'+(names[e.action]||'说话')+'口型…');$('#stage-message').textContent='正在准备播报';}if(e.event==='ready'&&e.playback_owner===clientId){queue.push(e);message('口型已生成，开始播放。');next();}if(e.event==='answer')$('#answer').textContent+=e.text;if(e.event==='answer_complete')$('#answer').textContent=e.text;if(e.event==='error')message(e.message,true);};socket.onclose=()=>setTimeout(connect,1500);}
async function health(){try{const h=await(await fetch('/api/health')).json();badge('#fay-tag',h.fay_connected?'Fay 已连接':'Fay 未连接',h.fay_connected);badge('#model-tag',h.model_state==='ready'?'口型已就绪':h.model_state==='error'?'口型加载失败':'口型准备中',h.model_state==='ready');badge('#core-state',h.fay_core?'运行中':'未启动',h.fay_core);badge('#render-state',h.model_state==='ready'?'已就绪':'准备中',h.model_state==='ready');badge('#provider-state',h.provider.configured?(h.dialogue_verified?'问答已通过':'已配置 · 待问答验证'):'待配置',h.provider.configured);$('#start').textContent=h.fay_core?'Fay 核心已运行':'启动 Fay 核心';$('#start').disabled=h.fay_core;$('#model').placeholder=h.provider.model;}catch{message('无法连接本机数字人服务。',true);}}
$('#start').onclick=async()=>{try{message('正在启动 Fay 核心…');await api('start');await health();message('Fay 核心已启动，可以进行本机播报。');}catch(e){message(e.message,true);}};
$('#send').onclick=async()=>{const text=$('#text').value.trim();if(!text)return;try{stopLocal();$('#answer').textContent='';message(mode==='say'?'正在提交给 Fay 播报…':'正在等待通义千问回答…');const r=await api(mode,{text});epoch=Math.max(epoch,r.epoch);}catch(e){message(e.message,true);}};
$('#interrupt').onclick=async()=>{stopLocal();try{const r=await api('interrupt');epoch=Math.max(epoch,r.epoch);message('已打断当前播报与待播队列。');}catch(e){message(e.message,true);}};
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>{mode=button.dataset.mode;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('selected',b===button));$('#send').textContent=mode==='say'?'开始播报':'发送问题';$('#text').placeholder=mode==='say'?'输入要让讲解员说的话，例如：您好，欢迎来到我们的展厅。':'输入要向通义千问提出的问题。';});
document.querySelectorAll('[data-motion]').forEach(button=>button.onclick=async()=>{stopLocal();try{epoch=Math.max(epoch,(await api('interrupt')).epoch);}catch{}const action=button.dataset.motion;queue.push({epoch,action,silent:true,video:'/motion/'+action,rest:'/motion-rest/'+action});next();message('正在预览'+names[action]+'。');});
$('#save-provider').onclick=async()=>{try{const r=await api('provider',{api_key:$('#api-key').value,model:$('#model').value,base_url:$('#base-url').value});$('#api-key').value='';message('百炼配置已保存。点击“通义问答”可进行实际验证。');await health();}catch(e){$('#api-key').value='';message(e.message,true);}};
$('#fullscreen').onclick=()=>$('#stage').requestFullscreen().catch(()=>message('浏览器未允许进入全屏，请重试。',true));
$('#exit-fullscreen').onclick=()=>document.exitFullscreen().catch(()=>{});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});$('#interrupt').click();}});
connect();health();setInterval(health,4000);
</script></html>
