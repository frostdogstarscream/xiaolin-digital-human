<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小霖 50 帧实时实验</title><style>body{background:#0c171d;color:#e8f3f5;font:16px/1.7 system-ui;margin:20px}main{max-width:1100px;margin:auto}video{width:100%;height:65vh;object-fit:contain;background:#000}button,a{padding:9px 14px;margin:5px;border:0;border-radius:8px;background:#72c8b6;color:#142b2a;cursor:pointer}pre{white-space:pre-wrap}p{color:#a8c4ca}</style><main><h2>小霖 · 50 帧实时实验</h2><p>独立实验会话，1080p / FP16。使用冻结的本地语音，不调用大模型、TTS、记忆或打卡服务。下面的动作按钮仅用于实验验收，正式页面保持自动动作。</p><video id="video" autoplay playsinline controls></video><div><button onclick="connect()">连接实验</button><button onclick="cmd('speech')">播放测试语音</button><button onclick="cmd('welcome-wave')">迎宾</button><button onclick="cmd('goodbye-wave')">告别</button><button onclick="cmd('explain-open-palms')">讲解</button><button onclick="cmd('acknowledge-nod')">点头</button><button onclick="cmd('interrupt')">打断</button><button onclick="disconnect()">断开</button><button onclick="video.requestFullscreen()">人物全屏</button></div><pre id="status">未连接</pre><p><a href="./">查看 25 / 50 帧预览对照</a></p></main>
<script>
let pc,token,timer,last;const video=document.getElementById('video'),status=document.getElementById('status');
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'Content-Type':'application/json','X-Trial-Session':token||''},...(body?{body:JSON.stringify(body)}:{})});if(!r.ok)throw Error(await r.text());return r.json()}
async function connect(){try{if(pc)return;const config=await api('rtc-config');pc=new RTCPeerConnection(config);pc.addTransceiver('audio',{direction:'recvonly'});pc.addTransceiver('video',{direction:'recvonly'});const stream=new MediaStream();video.srcObject=stream;pc.ontrack=e=>{stream.addTrack(e.track);video.play().catch(()=>{})};pc.onconnectionstatechange=()=>status.textContent='连接：'+pc?.connectionState;await pc.setLocalDescription(await pc.createOffer());await new Promise(resolve=>{if(pc.iceGatheringState==='complete')resolve();else{const t=setTimeout(resolve,5000);pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete'){clearTimeout(t);resolve()} })}});const answer=await api('offer',{sdp:pc.localDescription.sdp,type:'offer'});token=answer.token;await pc.setRemoteDescription({type:answer.type,sdp:answer.sdp});timer=setInterval(poll,1000)}catch(e){status.textContent=String(e);if(pc)pc.close();pc=null}}
async function cmd(kind){try{await api('command',{kind})}catch(e){status.textContent=String(e)}}
async function disconnect(){clearInterval(timer);if(token)await cmd('disconnect');if(pc)pc.close();pc=null;token=null;last=null;window.trialMetrics=null;status.textContent='已断开';video.srcObject=null}
async function poll(){try{const state=await api('status');let receive;for(const r of (await pc.getStats()).values())if(r.type==='inbound-rtp'&&(r.kind==='video'||r.mediaType==='video')){receive={frames:r.framesDecoded,dropped:r.framesDropped,timestamp:r.timestamp,width:r.frameWidth,height:r.frameHeight};if(last)receive.fps=(r.framesDecoded-last.frames)*1000/(r.timestamp-last.timestamp);last=receive}window.trialMetrics={state,receive};status.textContent='连接：'+pc.connectionState+'\n接收帧率：'+(receive?.fps?.toFixed(1)||'采样中')+' fps\n分辨率：'+receive?.width+' × '+receive?.height+'\n音频待处理：'+state.queue_seconds.toFixed(2)+' 秒\n当前画面：'+state.pose.join(' / ')+'\n最近待机片段：'+state.segment_history.map(i=>['A','B','C'][i]).join(' → ')}catch(e){status.textContent=String(e)}}
</script></html>
